<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Field Blocks — ECO IGM Smart Irrigation</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8f5;color:#24352c}.header{background:#176b45;color:#fff;padding:14px 4%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.header h1{font-size:18px;margin:0}.header p{font-size:11px;opacity:.85;margin:3px 0 0}.lang{display:flex;gap:5px}.lang button{border:1px solid #b7dfc7;background:#fff;color:#176b45;border-radius:5px;padding:6px 10px;cursor:pointer}.lang button.active{background:#d7f0df;font-weight:bold}.nav{background:#163b2c;padding:9px 4%;display:flex;gap:16px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;font-size:13px}.layout{display:grid;grid-template-columns:320px 1fr;gap:14px;padding:14px 4%}.panel{background:#fff;border-radius:10px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}#map{height:560px;border-radius:8px}.field{border-bottom:1px solid #e8eee9;padding:10px 0;cursor:pointer}.field.active{background:#e9f6ed;border-radius:6px;padding:10px}.muted{font-size:12px;color:#65756b}.controls{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.btn{border:0;background:#176b45;color:white;border-radius:5px;padding:7px 10px;cursor:pointer;font-size:12px}.btn.secondary{background:#e5eee8;color:#176b45}.sensor{display:flex;gap:7px;align-items:center;font-size:12px;padding:5px 0}@media(max-width:800px){.layout{grid-template-columns:1fr}#map{height:380px}}</style></head>
<body><header class="header"><div><h1 data-i18n="ecoHeader">ECO IGM Smart Irrigation System</h1><p data-i18n="prototype">Ventspils University of Applied Sciences — Prototype Dashboard</p></div><div class="lang"><button data-lang="en" onclick="setLanguage('en')">EN</button><button data-lang="lv" onclick="setLanguage('lv')">LV</button></div></header><nav class="nav"><a href="/dashboard.html" data-i18n="dashboard">Dashboard</a><a href="/field-blocks.html" data-i18n="fields">Field blocks</a><a href="/sensors.html" data-i18n="sensors">Sensors</a><a href="/zones.html" data-i18n="zones">Zones</a><a href="/alerts.html" data-i18n="alerts">Alerts</a></nav><main class="layout"><aside class="panel"><h2 data-i18n="fields">Field blocks</h2><div id="fieldList" class="muted">Loading...</div><hr><h3 data-i18n="selectedSensors">Selected sensors</h3><div id="sensorList"></div><div class="controls"><button class="btn" onclick="showSelected()" data-i18n="showSelected">Show selected sensors</button><button class="btn secondary" onclick="showAll()" data-i18n="showAll">Show all sensors</button></div><div class="controls"><button class="btn secondary" onclick="document.getElementById('geoInput').click()" data-i18n="loadGeoJson">Load GeoJSON</button><button class="btn secondary" onclick="startDrawing()" data-i18n="drawField">Draw field</button></div><input id="geoInput" type="file" accept=".geojson,.json" hidden></aside><section class="panel"><div id="fieldInfo" class="muted">Select a field block</div><div id="map"></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/js/lang.js"></script><script>let map,fieldLayer,allSensors=[],selectedField=null,selectedSensorIds=new Set(),markers=[],drawMode=false,drawPoints=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function init(){map=L.map('map').setView([57.39,21.56],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);map.on('click',e=>{if(drawMode){drawPoints.push([e.latlng.lng,e.latlng.lat]);renderDraft()}});document.getElementById('geoInput').addEventListener('change',loadGeoJson);loadFields()}async function api(u,o){const r=await fetch(u,o);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}async function loadFields(){try{const [fields,sensors]=await Promise.all([api('/api/fields'),api('/api/sensors').catch(()=>[])]);allSensors=Array.isArray(sensors)?sensors:[];renderFields(fields);if(fields.length)selectField(fields[0])}catch(e){document.getElementById('fieldList').textContent='Could not load fields: '+e.message}}function renderFields(fields){window._fields=fields;document.getElementById('fieldList').innerHTML=fields.length?fields.map(f=>`<div class="field ${selectedField&&selectedField.id===f.id?'active':''}" onclick="selectFieldById(${f.id})"><b>${esc(f.name)}</b><div class="muted">${esc(f.cropType||'')} · ${esc(f.cadastralNumber||'')}</div></div>`).join(''):'<div class="muted">'+t('noFields')+'</div>'}function selectFieldById(id){selectField((window._fields||[]).find(f=>f.id===id))}function selectField(f){if(!f)return;selectedField=f;selectedSensorIds.clear();renderFields(window._fields||[f]);renderInfo();renderSensors();renderPolygon()}function renderInfo(){const f=selectedField;document.getElementById('fieldInfo').innerHTML=`<h2>${esc(f.name)}</h2><div>${t('crop')}: ${esc(f.cropType||'—')} · ${t('area')}: ${esc(f.areaHa||'—')} ha · ${t('cadastral')}: ${esc(f.cadastralNumber||'—')}</div>${f.grafanaUrl?`<p><a href="${esc(f.grafanaUrl)}" target="_blank" rel="noopener">${t('openGrafana')}</a></p>`:''}`}function renderSensors(){const list=document.getElementById('sensorList');const ss=allSensors.filter(s=>!selectedField||s.fieldBlockId===selectedField.id||s.zoneId===selectedField.id);list.innerHTML=ss.length?ss.map(s=>`<label class="sensor"><input type="checkbox" onchange="toggleSensor('${esc(s.sensorId)}',this.checked)"><span>${esc(s.sensorId)} ${s.moisture!=null?esc(s.moisture)+'%':''}</span></label>`).join(''):'<div class="muted">No sensor data for this field</div>'}function toggleSensor(id,yes){yes?selectedSensorIds.add(id):selectedSensorIds.delete(id);renderMarkers([...selectedSensorIds])}function renderMarkers(ids){markers.forEach(m=>map.removeLayer(m));markers=[];allSensors.filter(s=>ids.includes(s.sensorId)).forEach(s=>markers.push(L.circleMarker([s.latitude,s.longitude],{radius:8,color:'#176b45',fillColor:'#2f855a',fillOpacity:.85}).addTo(map).bindPopup(`<b>${esc(s.sensorId)}</b><br>${esc(s.locationLabel||'')}<br>${s.moisture??'—'}%`)))}function showSelected(){renderMarkers([...selectedSensorIds])}function showAll(){renderMarkers(allSensors.map(s=>s.sensorId))}function renderPolygon(){if(fieldLayer)map.removeLayer(fieldLayer);fieldLayer=null;if(!selectedField.geometryGeoJson)return;try{fieldLayer=L.geoJSON(JSON.parse(selectedField.geometryGeoJson),{style:{color:'#176b45',weight:3,fillOpacity:.18}}).addTo(map);map.fitBounds(fieldLayer.getBounds())}catch(e){console.warn(e)}}function renderDraft(){if(fieldLayer)map.removeLayer(fieldLayer);if(drawPoints.length<2)return;fieldLayer=L.polygon(drawPoints.map(p=>[p[1],p[0]]),{color:'#e0a800',dashArray:'5,5'}).addTo(map)}function startDrawing(){drawMode=true;drawPoints=[];alert('Click points on the map, then load a saved GeoJSON to store the field polygon.')}function loadGeoJson(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);const g=data.type==='Feature'?data.geometry:data.type==='FeatureCollection'?data.features[0].geometry:data;if(!g||!['Polygon','MultiPolygon'].includes(g.type))throw Error('GeoJSON must contain Polygon or MultiPolygon');const name=prompt('Field name','Imported field');if(!name)return;api('/api/fields',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,geometryGeoJson:JSON.stringify(data),source:'GeoJSON import',active:true})}).then(loadFields).catch(x=>alert(x.message))}catch(x){alert('Invalid GeoJSON: '+x.message)}};reader.readAsText(file)}window.addEventListener('languagechange',()=>{if(window._fields)renderFields(window._fields);if(selectedField){renderInfo();renderSensors()}});init()</script></body></html>
