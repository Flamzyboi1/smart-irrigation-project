<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field Blocks — ECO IGM</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f8f5;color:#24352c}.header{background:#176b45;color:white;padding:16px 4%}.header b{font-size:20px}.wrap{padding:22px 4%;display:grid;grid-template-columns:360px 1fr;gap:18px}.panel{background:#fff;padding:18px;border-radius:12px;box-shadow:0 2px 14px #0001}.btn{background:#176b45;color:#fff;border:0;border-radius:6px;padding:10px 14px;cursor:pointer;margin:4px 4px 4px 0}.error{background:#fee2e2;color:#991b1b;padding:10px;border-radius:6px;margin:10px 0}.ok{color:#176b45;margin-top:8px}.field{padding:10px 0;border-bottom:1px solid #ddd;cursor:pointer}#map{height:620px;border-radius:8px}input{width:100%;padding:9px;box-sizing:border-box;margin:4px 0;border:1px solid #ccd8ce;border-radius:5px}@media(max-width:850px){.wrap{grid-template-columns:1fr}#map{height:420px}}</style></head><body><header class="header"><b>ECO IGM</b><div data-i18n="smartPrototype">Smart Irrigation Prototype</div></header><main class="wrap"><section class="panel"><h2 data-i18n="fieldBlocks">Field Blocks</h2><div id="fields" data-i18n="loading">Loading...</div><hr><h3 data-i18n="loadGeoJson">Load GeoJSON</h3><input id="file" type="file" accept=".geojson,.json,application/geo+json,application/json"><button class="btn" id="load" data-i18n="load">Load GeoJSON</button><div id="message"></div></section><section class="panel"><div id="map"></div></section></main><script src="/js/site-nav.js"></script><script src="/js/lang.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let map,geoLayer;function msg(text,bad=false){const e=document.getElementById('message');e.className=bad?'error':'ok';e.textContent=text}function render(data){const fs=data.features||[];document.getElementById('fields').innerHTML=fs.map((f,i)=>`<div class="field"><b>${esc(f.properties?.name||'Field '+(i+1))}</b><br>${esc(f.properties?.crop||'')} — ${esc(f.properties?.status||'')}</div>`).join('')||t('noFields');if(geoLayer)geoLayer.remove();geoLayer=L.geoJSON(data,{style:{color:'#176b45',weight:3,fillOpacity:.28},onEachFeature:(f,l)=>l.bindPopup(`<b>${esc(f.properties?.name||'Field')}</b>`)}).addTo(map);const bounds=geoLayer.getBounds();if(bounds.isValid())map.fitBounds(bounds,{padding:[20,20]})}async function loadApi(){try{const r=await fetch('/api/field-blocks');if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();document.getElementById('fields').innerHTML=(Array.isArray(data)?data:[]).map(f=>`<div class="field"><b>${esc(f.name)}</b></div>`).join('')||t('noFields')}catch(e){msg('Could not load field blocks: '+e.message,true)}}document.getElementById('load').onclick=()=>{const f=document.getElementById('file').files[0];if(!f)return msg(t('chooseFile'),true);const reader=new FileReader();reader.onload=async()=>{try{const data=JSON.parse(reader.result);if(data.type!=='FeatureCollection'||!Array.isArray(data.features))throw Error(t('invalidGeo'));render(data);for(const feature of data.features){const p=feature.properties||{};const r=await fetch('/api/field-blocks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:p.name||'Imported field'})});if(!r.ok)throw Error('Server HTTP '+r.status)}msg(t('success'))}catch(e){msg('GeoJSON load failed: '+e.message,true)}};reader.readAsText(f)};document.addEventListener('languagechange',()=>{if(document.getElementById('fields').children.length===0)document.getElementById('fields').textContent=t('noFields')});map=L.map('map').setView([57.412,21.56],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);loadApi();</script></body></html>
