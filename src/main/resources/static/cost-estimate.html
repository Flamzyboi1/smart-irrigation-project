<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cost Estimate</title><style>body{font:15px Arial;margin:0;background:#eef8f0;color:#183b25}header,main{padding:18px 6%;background:#fff;border-bottom:1px solid #d4e4d6}main{background:transparent}nav a{margin-right:14px;color:#183b25}.card{background:#fff;padding:20px;margin:18px 0;border:1px solid #d4e4d6;border-radius:12px}label{display:block;margin:10px 0}input{padding:8px;display:block;width:100%;max-width:340px}button{background:#1b6b32;color:#fff;border:0;padding:9px 12px;border-radius:6px}.result{font-size:18px;color:#1b6b32}</style></head><body><header><nav><a href="/dashboard.html">Dashboard</a><a href="/water-calculation.html">Water calculation</a><a href="/crop-characteristics.html">Crop characteristics</a><a href="/cost-estimate.html">Cost estimate</a><a href="/senslog.html">SensLog</a></nav></header><main><div class="card"><button onclick="lang='en';render()">English</button> <button onclick="lang='lv';render()">Latviešu</button><h1 id="title">Irrigation cost estimate</h1><label id="volLabel">Water volume (litres)<input id="volume" type="number" value="10000"></label><label id="priceLabel">Price per m³ (€)<input id="price" type="number" value="1.5" step="0.01"></label><button id="calc" onclick="calculate()">Calculate</button><p id="result" class="result"></p></div></main><script>let lang='en';const t={en:{title:'Irrigation cost estimate',vol:'Water volume (litres)',price:'Price per m³ (€)',calc:'Calculate'},lv:{title:'Apūdeņošanas izmaksu aprēķins',vol:'Ūdens daudzums (litri)',price:'Cena par m³ (€)',calc:'Aprēķināt'}};function render(){let x=t[lang];title.textContent=x.title;volLabel.firstChild.textContent=x.vol;priceLabel.firstChild.textContent=x.price;calc.textContent=x.calc}function calculate(){let cost=+volume.value/1000*+price.value;result.textContent=lang==='lv'?`Aprēķinātās izmaksas: €${cost.toFixed(2)}`:`Estimated
