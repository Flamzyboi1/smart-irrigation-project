<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Readings — ECO IGM Smart Irrigation</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8f5;color:#24352c}.header{background:#176b45;color:#fff;padding:18px 4%;display:flex;justify-content:space-between;align-items:center}.header h1{margin:0;font-size:20px}.wrap{padding:22px 4%}.panel{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 14px rgba(0,0,0,.08)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e6eee8;text-align:left;font-size:13px}th{background:#176b45;color:#fff}.error{background:#fee2e2;color:#991b1b;padding:10px;border-radius:6px;margin-bottom:12px}</style></head><body><header class="header"><div><h1>ECO IGM Smart Irrigation System</h1><p>Ventspils University of Applied Sciences — Prototype Dashboard</p></div></header><main class="wrap"><section class="panel"><h2>Sensor Readings</h2><div id="error"></div><table><thead><tr><th>Sensor</th><th>Zone</th><th>Moisture</th><th>Temperature</th><th>Recommendation</th><th>Timestamp</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></section></main><script src="/js/site-nav.js"></script><script>async function load(){try{const r=await fetch('/api/readings');if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const rows=Array.isArray(d)?d:(d._embedded?Object.values(d._embedded)[0]:[]);document.getElementById('rows').innerHTML=rows.length?rows.map(x=>`<tr><td>${x.sensorId||'—'}</td><td>${x.zoneName||'—'}</td><td>${x.moisture??'—'}</td><td>${x.temperature??'—'}</td><td>${x.recommendation||'—'}</td><td>${x.timestamp||'—'}</td></tr>`).join(''):'<tr><td colspan="6">No readings found</td></tr>'}catch(e){document.getElementById('error').textContent='Could not load readings: '+e.message;document.getElementById('rows').innerHTML='<tr><td colspan="6">Data unavailable</td></tr>'}}load()</script></body></html>
