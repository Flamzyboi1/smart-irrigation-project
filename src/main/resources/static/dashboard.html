<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECO IGM Smart Irrigation Dashboard</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f8f5;color:#24352c}.app-header{background:#176b45;color:#fff;padding:20px 4%;display:flex;align-items:center;justify-content:space-between}.brand h1{margin:0;font-size:24px}.brand p{margin:5px 0 0;font-size:14px}.wrap{padding:20px 4%}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 14px rgba(0,0,0,.08)}.value{font-size:28px;color:#176b45;font-weight:bold}.label{margin-top:5px}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.cards{grid-template-columns:1fr}}</style></head><body><header class="app-header"><div class="brand"><h1>ECO IGM</h1><p>Smart Irrigation Prototype</p></div></header><main class="wrap"><section class="cards"><div class="card"><div class="value" id="totalSensors">0</div><div class="label">Total Sensors</div></div><div class="card"><div class="value" id="activeZones">0</div><div class="label">Active Zones</div></div><div class="card"><div class="value" id="activeAlerts">0</div><div class="label">Active Alerts</div></div><div class="card"><div class="value" id="irrigatingNow">0</div><div class="label">Irrigating Now</div></div></section><section class="panel"><h2>Sensor Map</h2><p>Smart irrigation monitoring dashboard for ECO IGM.</p></section></main><script src="/js/site-nav.js"></script></body></html>
