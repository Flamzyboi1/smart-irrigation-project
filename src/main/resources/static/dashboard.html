<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECO IGM Smart Irrigation Dashboard</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8f5;color:#24352c}.header{background:#176b45;color:#fff;padding:14px 4%;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.header h1{font-size:18px;margin:0}.header p{font-size:11px;opacity:.85;margin:3px 0 0}.nav{background:#163b2c;padding:9px 4%;display:flex;gap:16px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;font-size:13px}.nav a.active{font-weight:bold;text-decoration:underline}.lang{display:flex;gap:5px}.lang button{border:1px solid #b7dfc7;background:#fff;color:#176b45;border-radius:5px;padding:6px 10px;cursor:pointer}.lang button.active{background:#d7f0df;font-weight:bold}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 4%}.stat,.panel{background:#fff;border-radius:10px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}.stat h3{font-size:22px;color:#176b45;margin:0}.stat p{font-size:12px;color:#667;margin:5px 0 0}.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;padding:0 4% 14px}.map{height:470px;border-radius:8px}.panel h2{font-size:15px;margin:0 0 10px;color:#176b45}.card{padding:10px;border-bottom:1px solid #eef2ef;font-size:13px}.badge{display:inline-block;padding:3px 7px;border-radius:10px;font-size:11px;font-weight:bold}.ok{background:#d8f3df;color:#166534}.alert{background:#fee2e2;color:#991b1b}.warn{background:#fef3c7;color:#92400e}.cta{display:inline-block;background:#176b45;color:#fff;text-decoration:none;padding:9px 12px;border-radius:5px;font-size:13px;margin-top:8px}.muted{font-size:12px;color:#65756b}.error{color:#991b1b;background:#fee2e2;padding:8px;border-radius:5px;font-size:12px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.map{height:340px}}</style></head>
<body><header class="header"><div><h1 data-i18n="ecoHeader">ECO IGM Smart Irrigation System</h1><p data-i18n="prototype">Ventspils University of Applied Sciences — Prototype Dashboard</p></div><div class="lang"><button data-lang="en" onclick="setLanguage('en')">EN</button><button data-lang="lv" onclick="setLanguage('lv')">LV</button></div></header><nav class="nav"><a class="active" href="/dashboard.html" data-i18n="dashboard">Dashboard</a><a href="/field-blocks.html" data-i18n="fields">Field blocks</a><a href="/sensors.html" data-i18n="sensors">Sensors</a><a href="/zones.html" data-i18n="zones">Zones</a><a href="/alerts.html" data-i18n="alerts">Alerts</a><a href="/readings.html" data-i18n="readings">Readings</a></nav><section class="stats"><div class="stat"><h3 id="sensorCount">—</h3><p data-i18n="totalSensors">Total sensors</p></div><div class="stat"><h3 id="zoneCount">—</h3><p data-i18n="activeZones">Active zones</p></div><div class="stat"><h3 id="alertCount">—</h3><p data-i18n="activeAlerts">Active alerts</p></div><div class="stat"><h3 id="valveCount">—</h3><p data-i18n="irrigatingNow">Irrigating now</p></div></section><main class="grid"><section class="panel"><h2 data-i18n="sensorMap">Field sensor map</h2><div id="map" class="map"></div></section><aside class="panel"><h2 data-i18n="latestStatus">Latest sensor status</h2><div id="sensorList" class="muted">Loading…</div><a class="cta" href="/field-blocks.html" data-i18n="openFieldBlocks">Open field blocks and polygons</a></aside></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/js/lang.js"></script><script>let map;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function json(u){const r=await fetch(u);if(!r.ok)throw Error(u+' HTTP '+r.status);return r.json()}async function load(){const list=document.getElementById('sensorList');try{const sensors=await json('/api/dashboard');const zones=await json('/api/zones').catch(()=>[]);const alerts=await json('/api/alerts/active').catch(()=>[]);document.getElementById('sensorCount').textContent=sensors.length;document.getElementById('zoneCount').textContent=zones.length;document.getElementById('alertCount').textContent=alerts.length;document.getElementById('valveCount').textContent=sensors.filter(s=>s.valveOpen).length;list.innerHTML=sensors.length?sensors.map(s=>`<div class="card"><b>${esc(s.sensorId||s.label||'Sensor')}</b><br><span class="muted">${esc(s.zoneName||'')} · ${s.moisture??'—'}%</span><br><span class="badge ${s.recommendation==='IRRIGATE_NOW'?'alert':s.recommendation==='IRRIGATE'?'warn':'ok'}">${esc(s.recommendation||'NO DATA')}</span></div>`).join(''):'No sensor data';sensors.forEach(s=>{if(Number.isFinite(s.latitude)&&Number.isFinite(s.longitude))L.circleMarker([s.latitude,s.longitude],{radius:8,color:'#176b45',fillColor:'#2f855a',fillOpacity:.85}).addTo(map).bindPopup(`<b>${esc(s.sensorId||s.label||'Sensor')}</b><br>${esc(s.zoneName||'')}<br>${s.moisture??'—'}%`)})}catch(e){list.innerHTML='<div class="error">Dashboard API unavailable: '+esc(e.message)+'</div>'}}function init(){map=L.map('map').setView([57.39,21.56],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);load()}window.addEventListener('languagechange',load);init();</script></body></html>
