<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alerts — ECO IGM</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f8f5;color:#24352c}.header{background:#176b45;color:#fff;padding:20px 4%;display:flex;justify-content:space-between;align-items:center}.header h1{margin:0;font-size:24px}.header p{margin:5px 0 0;font-size:14px}.wrap{padding:22px 4%}.panel{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 14px rgba(0,0,0,.08)}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e3ebe5;text-align:left}th{background:#176b45;color:#fff}.empty{padding:18px 0}.badge{padding:4px 8px;border-radius:12px;font-size:12px;background:#fef3c7}.resolved{background:#dcfce7}@media(max-width:650px){table{font-size:13px}}</style></head><body><header class="header"><div><h1>ECO IGM</h1><p data-i18n="smartPrototype">Smart Irrigation Prototype</p></div></header><main class="wrap"><section class="panel"><h2 data-i18n="irrigationAlerts">Irrigation Alerts</h2><div style="overflow:auto"><table><thead><tr><th data-i18n="alert">Alert</th><th data-i18n="zone">Zone</th><th data-i18n="message">Message</th><th data-i18n="severity">Severity</th><th data-i18n="status">Status</th><th data-i18n="created">Created</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty" data-i18n="loading">Loading...</td></tr></tbody></table></div></section></main><script src="/js/lang.js"></script><script src="/js/site-nav.js"></script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function val(o,...keys){for(const k of keys)if(o?.[k]!==undefined&&o[k]!==null)return o[k];return ''}async function load(){try{const r=await fetch('/api/alerts');if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const a=Array.isArray(d)?d:(d._embedded?Object.values(d._embedded).find(Array.isArray)||[]:[]);document.getElementById('rows').innerHTML=a.map(x=>{const st=val(x,'status','state');return `<tr><td>${esc(val(x,'title','name','id'))}</td><td>${esc(val(x,'zoneName','zone'))}</td><td>${esc(val(x,'message','description'))}</td><td><span class="badge">${esc(val(x,'severity','level'))}</span></td><td><span class="badge ${String(st).toLowerCase()==='resolved'?'resolved':''}">${esc(st)}</span></td><td>${esc(val(x,'createdAt','timestamp','date'))}</td></tr>`}).join('')||`<tr><td colspan="6" class="empty">${t('noAlerts')}</td></tr>`}catch(e){document.getElementById('rows').innerHTML=`<tr><td colspan="6" class="empty">${t('loadError')}: ${esc(e.message)}</td></tr>`}}load();</script></body></html>
