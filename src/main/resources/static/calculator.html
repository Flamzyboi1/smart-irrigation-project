<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Irrigation Calculator</title><style>body{font:15px Arial;margin:0;background:#eef8f0;color:#183b25}header,main{padding:18px 6%}header{background:#fff;border-bottom:1px solid #d4e4d6}nav a{margin-right:14px;color:#183b25}.card{max-width:700px;background:#fff;padding:24px;margin:20px auto;border:1px solid #d4e4d6;border-radius:12px}label{display:block;margin:12px 0}input{display:block;padding:9px;width:100%;max-width:360px}button{background:#1b6b32;color:#fff;border:0;padding:10px 14px;border-radius:6px;margin-right:8px}.result{font-size:18px;color:#1b6b32}</style></head><body><header><nav><a href="/dashboard.html">Dashboard</a><a href="/field-blocks.html">Field blocks</a><a href="/water-calculation.html">Water calculation</a><a href="/crop-characteristics.html">Crop characteristics</a><a href="/cost-estimate.html">Cost estimate</a><a href="/calculator.html">Calculator</a><a href="/senslog.html">SensLog</a></nav></header><main><div class="card"><button onclick="setLang('en')">English</button><button onclick="setLang('lv')">Latviešu</button><h1 id="title">Irrigation calculator</h1><label id="areaLabel">Area (m²)<input id="area" type="number" value="1000"></label><label id="depthLabel">Irrigation depth (mm)<input id="depth" type="number" value="10" step="0.1"></label><label id="effLabel">Efficiency (%)<input id="eff" type="number" value="80"></label><button id="calc" onclick="calculate()">Calculate</button><p id="result" class="result"></p></div></main><script>let lang='en';const t={en:{title:'Irrigation calculator',area:'Area (m²)',depth:'Irrigation depth (mm)',eff:'Efficiency (%)',calc:'Calculate'},lv:{title:'Apūdeņošanas kalkulators',area:'Platība (m²)',depth:'Apūdeņošanas slānis (mm)',eff:'Efektivitāte (%)',calc:'Aprēķināt'}};function setLang(x){lang=x;const s=t[x];title.textContent=s.title;areaLabel.firstChild.textContent=s.area;depthLabel.firstChild.textContent=s.depth;effLabel.firstChild.textContent=s.eff;calc.textContent=s.calc}function calculate(){const litres=+area.value*+depth.value/(+eff.value/100);result.textContent=lang==='lv'?`Nepieciešamais ūdens: ${litres.toFixed(0)} litri`:`Required water: ${litres.toFixed(0)} litres`}setLang('en')</script></body></html>
