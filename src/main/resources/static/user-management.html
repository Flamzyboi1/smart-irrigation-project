<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users — ECO IGM</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f8f5;color:#24352c}.header{background:#176b45;color:#fff;padding:20px 4%;display:flex;justify-content:space-between;align-items:center}.header h1{margin:0;font-size:24px}.header p{margin:5px 0 0;font-size:14px}.wrap{padding:22px 4%}.panel{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 14px rgba(0,0,0,.08);margin-bottom:18px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:4px}.field input,.field select{width:100%;padding:9px;border:1px solid #ccd8ce;border-radius:5px;box-sizing:border-box}.btn{background:#176b45;color:#fff;border:0;border-radius:6px;padding:10px 15px;cursor:pointer;margin-top:12px}.msg{margin-top:10px}.error{color:#991b1b;background:#fee2e2;padding:10px;border-radius:6px}.ok{color:#176b45}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e3ebe5;text-align:left}th{background:#176b45;color:#fff}.empty{padding:18px 0}@media(max-width:800px){.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.formgrid{grid-template-columns:1fr}}</style></head><body><header class="header"><div><h1>ECO IGM</h1><p data-i18n="smartPrototype">Smart Irrigation Prototype</p></div></header><main class="wrap"><section class="panel"><h2 data-i18n="addUser">Add New User</h2><form id="userForm"><div class="formgrid"><div class="field"><label data-i18n="fullName">Full Name</label><input name="fullName" required></div><div class="field"><label data-i18n="username">Username</label><input name="username" required></div><div class="field"><label data-i18n="email">Email Address</label><input name="email" type="email"></div><div class="field"><label data-i18n="password">Password</label><input name="password" type="password"></div><div class="field"><label data-i18n="role">Role</label><select name="role"><option>FARMER</option><option>ADMIN</option><option>SUPERADMIN</option></select></div><div class="field"><label data-i18n="status">Status</label><select name="status"><option>ACTIVE</option><option>DISABLED</option></select></div></div><button class="btn" type="submit" data-i18n="add">Add User</button><div id="msg" class="msg"></div></form></section><section class="panel"><h2 data-i18n="allUsers">All Users</h2><div style="overflow:auto"><table><thead><tr><th data-i18n="fullName">Full Name</th><th data-i18n="username">Username</th><th data-i18n="email">Email Address</th><th data-i18n="role">Role</th><th data-i18n="status">Status</th><th data-i18n="actions">Actions</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty" data-i18n="loading">Loading...</td></tr></tbody></table></div></section></main><script src="/js/lang.js"></script><script src="/js/site-nav.js"></script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function val(o,...keys){for(const k of keys)if(o?.[k]!==undefined&&o[k]!==null)return o[k];return ''}async function load(){try{const r=await fetch('/api/users');if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const a=Array.isArray(d)?d:(d._embedded?Object.values(d._embedded).find(Array.isArray)||[]:[]);document.getElementById('rows').innerHTML=a.map(u=>`<tr><td>${esc(val(u,'fullName','name'))}</td><td>${esc(val(u,'username','userName'))}</td><td>${esc(val(u,'email'))}</td><td>${esc(val(u,'role'))}</td><td>${esc(val(u,'status','enabled'))}</td><td>${esc(val(u,'actions'))}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">${t('noUsers')}</td></tr>`}catch(e){document.getElementById('rows').innerHTML=`<tr><td colspan="6" class="empty">${t('loadError')}: ${esc(e.message)}</td></tr>`}}document.getElementById('userForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('HTTP '+r.status);document.getElementById('msg').className='msg ok';document.getElementById('msg').textContent=t('savedUser');e.target.reset();load()}catch(x){document.getElementById('msg').className='msg error';document.getElementById('msg').textContent=t('saveError')+': '+x.message}};load();</script></body></html>
