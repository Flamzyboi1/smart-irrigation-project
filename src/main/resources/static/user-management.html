<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Management — ECO IGM</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8f5;color:#24352c}.header{background:#176b45;color:#fff;padding:16px 4%;display:flex;justify-content:space-between;align-items:center}.header h1{margin:0;font-size:20px}.header p{margin:3px 0 0;font-size:12px;opacity:.85}.langs button{margin-left:5px;padding:6px 10px;border:1px solid #b7dfc7;border-radius:5px;background:#fff;color:#176b45;cursor:pointer}.wrap{padding:22px 4%}.panel{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 14px rgba(0,0,0,.08);margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.input,select{width:100%;padding:10px;border:1px solid #cbd8ce;border-radius:6px;font-size:14px}.btn{background:#176b45;color:#fff;border:0;border-radius:6px;padding:10px 16px;cursor:pointer;font-weight:bold;margin-top:12px}.action{border:0;border-radius:4px;padding:5px 8px;cursor:pointer;margin-right:4px}.msg{margin-top:10px;color:#176b45;font-size:13px}.error{background:#fee2e2;color:#991b1b;padding:10px;border-radius:6px;margin-bottom:10px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e4ece6;text-align:left;font-size:13px}th{background:#176b45;color:#fff}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head><body><header class="header"><div><h1>ECO IGM Smart Irrigation System</h1><p>Ventspils University of Applied Sciences — Prototype Dashboard</p></div><div class="langs"><button data-lang="en" onclick="setLanguage('en')">EN</button><button data-lang="lv" onclick="setLanguage('lv')">LV</button></div></header><main class="wrap"><section class="panel"><h2 data-i18n="addUser">Add New User</h2><form id="userForm"><div class="grid"><input class="input" name="fullName" placeholder="Full Name" required><input class="input" name="username" placeholder="Username" required><input class="input" name="email" type="email" placeholder="Email Address" required><input class="input" name="password" type="password" placeholder="Password" required><select name="role"><option value="FARMER" data-i18n="farmer">Farmer</option><option value="ADMIN" data-i18n="admin">Administrator</option><option value="SUPERADMIN" data-i18n="superadmin">Super Administrator</option></select></div><button class="btn" type="submit" data-i18n="save">Add User</button><div id="msg" class="msg"></div></form></section><section class="panel"><h2 data-i18n="allUsers">All Users</h2><div id="error" class="error" hidden></div><div style="overflow:auto"><table><thead><tr><th>#</th><th data-i18n="fullName">Full Name</th><th>Username</th><th data-i18n="email">Email Address</th><th data-i18n="role">Role</th><th data-i18n="active">Status</th><th data-i18n="actions">Actions</th></tr></thead><tbody id="rows"><tr><td colspan="7">Loading…</td></tr></tbody></table></div></section></main><script src="/js/lang.js"></script><script src="/js/site-nav.js"></script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const r=await fetch('/api/users');if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const a=Array.isArray(d)?d:(d._embedded?Object.values(d._embedded)[0]:[]);document.getElementById('rows').innerHTML=a.map((u,i)=>`<tr><td>${i+1}</td><td>${esc(u.fullName)}</td><td>${esc(u.username)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${u.active?'Active':'Disabled'}</td><td><button class="action" onclick="toggleUser(${u.id},${!u.active})">${u.active?'Disable':'Enable'}</button><button class="action" onclick="deleteUser(${u.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="7">No users found</td></tr>'}catch(e){document.getElementById('error').hidden=false;document.getElementById('error').textContent='Could not load users: '+e.message}}async function send(url,method,body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error('HTTP '+r.status);return r.status===204?null:r.json()}document.getElementById('userForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await send('/api/users','POST',Object.fromEntries(f));document.getElementById('msg').textContent='User added';e.target.reset();load()}catch(x){document.getElementById('msg').textContent=x.message}};async function toggleUser(id,active){try{await send('/api/users/'+id+'/toggle','POST',{active});load()}catch(e){alert(e.message)}}async function deleteUser(id){if(confirm('Delete user?')){try{await send('/api/users/'+id,'DELETE');load()}catch(e){alert(e.message)}}}load();</script></body></html>
