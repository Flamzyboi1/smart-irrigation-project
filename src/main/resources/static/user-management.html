<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Users — Smart Irrigation Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f4f7f4; color: #222; }
    nav {
      background: #2d6a4f; color: white; padding: 14px 28px;
      display: flex; justify-content: space-between; align-items: center;
    }
    nav .brand { font-size: 1.2rem; font-weight: 700; }
    nav .brand span { font-size: 0.8rem; display: block; font-weight: 300; opacity: 0.8; }
    nav .links a { color: white; text-decoration: none; margin-left: 18px; font-size: 0.95rem; }
    nav .links a:hover { text-decoration: underline; }
    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
    h2 { color: #2d6a4f; margin-bottom: 20px; }
    .card { background: white; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); margin-bottom: 24px; }
    .card h3 { margin-bottom: 16px; color: #1b4332; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    input, select { width: 100%; padding: 9px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
    .btn { padding: 10px 22px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: 600; }
    .btn-green { background: #2d6a4f; color: white; margin-top: 14px; }
    .btn-green:hover { background: #1b4332; }
    .btn-red { background: #e63946; color: white; padding: 6px 12px; font-size: 0.8rem; border: none; border-radius: 4px; cursor: pointer; }
    .btn-toggle { background: #f4a261; color: white; padding: 6px 12px; font-size: 0.8rem; border: none; border-radius: 4px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #2d6a4f; color: white; padding: 10px 14px; text-align: left; font-size: 0.9rem; }
    td { padding: 10px 14px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    tr:hover { background: #f0faf4; }
    .badge { padding: 3px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; }
    .badge-active { background: #d8f3dc; color: #1b4332; }
    .badge-inactive { background: #fde8e8; color: #c0392b; }
    .badge-admin { background: #dbeafe; color: #1e40af; }
    .badge-farmer { background: #fef9c3; color: #92400e; }
    .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 0.9rem; }
    .msg-ok { background: #d8f3dc; color: #1b4332; }
    .msg-err { background: #fde8e8; color: #c0392b; }
    .actions { display: flex; gap: 6px; }
  </style>
</head>
<body>
<nav>
  <div class="brand">Smart Irrigation Dashboard <span>ECOIGM SIA — Prototype Dashboard</span></div>
  <div class="links">
    <a href="/index.html">Dashboard</a>
    <a href="/sensors.html">Sensors</a>
    <a href="/zones.html">Zones</a>
    <a href="/alerts.html">Alerts</a>
    <a href="/readings.html">Readings</a>
    <a href="/user-management.html">Users</a>
  </div>
</nav>
<div class="container">
  <h2>User Management</h2>
  <div class="card">
    <h3>Add New User</h3>
    <div id="msg"></div>
    <div class="form-grid">
      <input type="text" id="fullName" placeholder="Full Name"/>
      <input type="text" id="username" placeholder="Username"/>
      <input type="email" id="email" placeholder="Email Address"/>
      <input type="password" id="password" placeholder="Password"/>
      <select id="role">
        <option value="FARMER">Farmer</option>
        <option value="ADMIN">Admin</option>
      </select>
    </div>
    <button class="btn btn-green" onclick="addUser()">Add User</button>
  </div>
  <div class="card">
    <h3>All Users</h3>
    <table>
      <thead>
        <tr>
          <th>#</th><th>Full Name</th><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="userTable"><tr><td colspan="7" style="text-align:center;color:#aaa">Loading...</td></tr></tbody>
    </table>
  </div>
</div>
<script>
  function showMsg(text, ok) {
    const el = document.getElementById('msg');
    el.className = 'msg ' + (ok ? 'msg-ok' : 'msg-err');
    el.textContent = text;
    setTimeout(() => el.textContent = '', 3000);
  }
  async function loadUsers() {
    const res = await fetch('/api/users');
    const users = await res.json();
    const tbody = document.getElementById('userTable');
    if (!users.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#aaa">No users found</td></tr>';
      return;
    }
    tbody.innerHTML = users.map(u => `
      <tr>
        <td>${u.id}</td>
        <td>${u.fullName}</td>
        <td>${u.username}</td>
        <td>${u.email}</td>
        <td><span class="badge ${u.role === 'ADMIN' ? 'badge-admin' : 'badge-farmer'}">${u.role}</span></td>
        <td><span class="badge ${u.active ? 'badge-active' : 'badge-inactive'}">${u.active ? 'Active' : 'Inactive'}</span></td>
        <td class="actions">
          <button class="btn-toggle" onclick="toggleUser(${u.id})">${u.active ? 'Disable' : 'Enable'}</button>
          <button class="btn-red" onclick="deleteUser(${u.id})">Delete</button>
        </td>
      </tr>
    `).join('');
  }
  async function addUser() {
    const body = {
      fullName: document.getElementById('fullName').value.trim(),
      username: document.getElementById('username').value.trim(),
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
      role: document.getElementById('role').value
    };
    if (!body.fullName || !body.username || !body.email || !body.password) {
      showMsg('Please fill in all fields.', false); return;
    }
    const res = await fetch('/api/users/register', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const data = await res.json();
    if (res.ok) {
      showMsg('User added successfully!', true);
      document.getElementById('fullName').value = '';
      document.getElementById('username').value = '';
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      loadUsers();
    } else {
      showMsg(data.error || 'Error adding user.', false);
    }
  }
  async function deleteUser(id) {
    if (!confirm('Delete this user?')) return;
    await fetch('/api/users/' + id, { method: 'DELETE' });
    loadUsers();
  }
  async function toggleUser(id) {
    await fetch('/api/users/' + id + '/toggle', { method: 'PUT' });
    loadUsers();
  }
  loadUsers();
</script>
</body>
</html>
