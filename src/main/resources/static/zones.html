<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zones — ECO IGM</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f8f5;color:#24352c}.header{background:#176b45;color:#fff;padding:20px 4%;display:flex;justify-content:space-between;align-items:center}.header h1{margin:0;font-size:24px}.header p{margin:5px 0 0;font-size:14px}.wrap{padding:22px 4%}.panel{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 14px rgba(0,0,0,.08)}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e3ebe5;text-align:left}th{background:#176b45;color:#fff}.empty{padding:18px 0}@media(max-width:700px){table{font-size:13px}}</style></head><body><header class="header"><div><h1>ECO IGM</h1><p data-i18n="smartPrototype">Smart Irrigation Prototype</p></div></header><main class="wrap"><section class="panel"><h2 data-i18n="zones">Zones</h2><div id="error" hidden></div><table><thead><tr><th data-i18n="zone">Zone</th><th data-i18n="field">Field</th><th data-i18n="status">Status</th><th data-i18n="moisture">Moisture</th><th data-i18n="irrigation">Irrigation</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty" data-i18n="loading">Loading...</td></tr></tbody></table></section></main><script src="/js/lang.js"></script><script src="/js/site-nav.js"></script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const r=await fetch('/api/zones');if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const a=Array.isArray(d)?d:(d._embedded?Object.values(d._embedded).find(Array.isArray)||[]:[]);document.getElementById('rows').innerHTML=a.map(z=>`<tr><td>${esc(z.name||z.zoneName||z.id)}</td><td>${esc(z.fieldName||z.fieldBlock?.name||'')}</td><td>${esc(z.status||'')}</td><td>${esc(z.moisture??z.moisturePercent??'')}</td><td>${esc(z.irrigationStatus||z.irrigating||'')}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">${t('noZones')}</td></tr>`}catch(e){document.getElementById('rows').innerHTML=`<tr><td colspan="5" class="empty">${t('loadError')}: ${esc(e.message)}</td></tr>`}}load();</script></body></html>
