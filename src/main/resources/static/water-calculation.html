<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Water Calculation</title><style>body{font:15px Arial;margin:0;background:#eef8f0;color:#183b25}header,main{max-width:1100px;margin:auto;padding:18px 5%}header{max-width:none;background:#fff;border-bottom:1px solid #d4e4d6}nav a{margin-right:14px;color:#183b25}.card{background:#fff;padding:20px;margin:18px 0;border:1px solid #d4e4d6;border-radius:12px}label{display:block;margin:10px 0}input,select{padding:8px;width:100%;max-width:340px}button{background:#1b6b32;color:#fff;border:0;padding:10px 14px;border-radius:6px;cursor:pointer}.result{font-size:18px;color:#1b6b32}</style></head><body><header><nav><a href="/dashboard.html">Dashboard</a><a href="/water-calculation.html">Water calculation</a><a href="/crop-characteristics.html">Crop characteristics</a><a href="/cost-estimate.html">Cost estimate</a><a href="/senslog.html">SensLog</a></nav></header><main><div class="card"><button onclick="lang='en';render()">English</button> <button onclick="lang='lv';render()">Latviešu</button><h1 id="title">Water calculation</h1><label id="cropLabel">Crop<select id="crop"></select></label><label id="areaLabel">Area (m²)<input id="area" type="number" value="1000"></label><label id="etLabel">Reference ET₀ (mm/day)<input id="et" type="number" value="4" step="0.1"></label><label id="daysLabel">Days<input id="days" type="number" value="7"></label><label id="effLabel">Irrigation efficiency (%)<input id="eff" type="number" value="80"></label><button id="calc" onclick="calculate()">Calculate</button><p id="result" class="result"></p></div></main><script>let lang='en',crops=[];const t={en:{title:'Water calculation',crop:'Crop',area:'Area (m²)',et:'Reference ET₀ (mm/day)',days:'Days',eff:'Irrigation efficiency (%)',calc:'Calculate'},lv:{title:'Ūdens aprēķins',crop:'Kultūra',area:'Platība (m²)',et:'Atskaites ET₀ (mm/dienā)',days:'Dienas',eff:'Apūdeņošanas efektivitāte (%)',calc:'Aprēķināt'}};async function init(){crops=(await fetch('/data/crop-characteristics.json')).json? (await (await fetch('/data/crop-characteristics.json')).json()).crops:[];render()}function render(){let x=t[lang];title.textContent=x.title;cropLabel.firstChild.textContent=x.crop+' ';areaLabel.firstChild.textContent=x.area+' ';etLabel.firstChild.textContent=x.et+' ';daysLabel.firstChild.textContent=x.days+' ';effLabel.firstChild.textContent=x.eff+' ';calc.textContent=x.calc;crop.innerHTML=crops.map(c=>`<option value="${c.id}">${c.name[lang]}</option>`).join('')}function calculate(){let c=crops.find(x=>x.id===crop.value),volume=+area.value*+et.value*+days.value*c.kc/(+eff.value/100),result=lang==='lv'?`Nepieciešamais ūdens: ${volume.toFixed(0)} litri`:`Required irrigation water: ${volume.toFixed(0)} litres`;document.getElementById('result').textContent=result}init()</script></body></html>
