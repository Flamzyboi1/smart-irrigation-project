<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Irrigation · SensLog</title><style>body{font:15px Arial;margin:0;background:#eef8f0;color:#183b25}header,main{padding:18px 6%}header{background:#fff;border-bottom:1px solid #d4e4d6}nav a{margin-right:14px;color:#183b25}.card{background:#fff;padding:20px;margin:18px 0;border:1px solid #d4e4d6;border-radius:12px}.controls{display:flex;gap:10px;flex-wrap:wrap}button{background:#1b6b32;color:#fff;border:0;padding:10px 14px;border-radius:6px;cursor:pointer}.unit{border:1px solid #d4e4d6;border-radius:10px;padding:16px;margin:14px 0}.reading{display:inline-block;background:#e3f1e4;border-radius:8px;padding:12px;margin:7px 7px 0 0;min-width:150px}.name{font-weight:bold;color:#1b6b32}.value{font-size:19px;font-weight:bold;margin-top:5px}.time{color:#587060;font-size:12px}.error{color:#9b1c1c}.raw{display:none;white-space:pre-wrap;background:#f5f7f5;padding:15px;border:1px solid #d4e4d6;border-radius:8px;overflow:auto}</style></head><body><header><nav><a href="/dashboard.html">Dashboard</a><a href="/field-blocks.html">Field blocks</a><a href="/water-calculation.html">Water calculation</a><a href="/crop-characteristics.html">Crop characteristics</a><a href="/cost-estimate.html">Cost estimate</a><a href="/calculator.html">Calculator</a><a href="/senslog.html">SensLog</a></nav></header><main><div class="card"><h1>Sensor monitoring</h1><p>Readable observations from the SensLog service.</p><div class="controls"><button onclick="loadLatest()">Load latest observations</button><button onclick="loadUnits()">Load physical units</button><button onclick="toggleRaw()">Show raw data</button></div></div><div id="status" class="card">Choose an action above.</div><div id="readings"></div><pre id="raw" class="raw"></pre></main><script>const sensors={'340510000':['Air temperature','°C',2],'340510001':['Air temperature 2','°C',2],'340510002':['Air temperature 3','°C',2],'410190000':['Relative humidity','%',1],'410190001':['Relative humidity 2','%',1],'410190002':['Relative humidity 3','%',1],'360200000':['Soil moisture','',2],'800020000':['Solar radiation','',1],'340230000':['Temperature','°C',2],'430110000':['Rainfall','',1],'690020000':['Wind speed','',2],'700020000':['Wind direction','°',2]};let last=null;function label(id){return sensors[String(id)]||['Sensor '+id,'',2]}async function get(path){status.textContent='Loading…';readings.innerHTML='';try{const r=await fetch('/api/senslog'+path),text=await r.text();if(!r.ok)throw new Error(text);last=JSON.parse(text);render(last);status.textContent='Latest sensor observations';raw.textContent=JSON.stringify(last,null,2)}catch(e){status.className='card error';status.textContent='Could not load SensLog data: '+e.message}}function render(rows){const groups={};(Array.isArray(rows)?rows:[]).forEach(x=>(groups[x.unitId]??=[]).push(x));readings.innerHTML=Object.entries(groups).map(([unit,items])=>`<div class="card unit"><h2>Measuring unit ${unit}</h2>${items.map(x=>{const l=label(x.sensorId);return `<div class="reading"><div class="name">${l[0]}</div><div class="value">${Number(x.observedValue).toFixed(l[2])} ${l[1]}</div><div class="time">${x.timeStamp||''}</div></div>`}).join('')}</div>`).join('')||'<div class="card">No observations found.</div>'}async function loadLatest(){await get('/latest')}async function loadUnits(){await get('/units')}function toggleRaw(){raw.style.display=raw.style.display==='block'?'none':'block'} </script></body></html>
