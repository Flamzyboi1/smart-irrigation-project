<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Irrigation · SensLog</title><style>body{font:15px Arial;margin:0;background:#f3f8f2;color:#183b25}header{padding:18px 6%;background:#fff;border-bottom:1px solid #d4e4d6}header a{color:#1b6b32;text-decoration:none;font-weight:bold}nav{float:right}nav a{margin-left:18px}.card{max-width:1000px;margin:28px auto;background:#fff;padding:22px;border:1px solid #d4e4d6;border-radius:12px}button{background:#1b6b32;color:#fff;border:0;padding:10px 14px;border-radius:6px;margin:0 8px 8px 0;cursor:pointer}pre{white-space:pre-wrap;background:#f5f7f5;padding:15px;border:1px solid #d4e4d6;border-radius:8px;min-height:80px}.error{color:#9b1c1c}</style></head><body><header><a href="/dashboard.html">Smart Irrigation</a><span> · SensLog</span><nav><a href="/dashboard.html">Irrigation dashboard</a></nav></header><main class="card"><h1>Sensor data</h1><p>View SensLog observations without changing irrigation data.</p><button type="button" onclick="load('/latest')">Load latest observations</button><button type="button" onclick="load('/units')">Load physical units</button><pre id="out">Click a button to load data.</pre></main><script>async function load(path){const out=document.getElementById('out');out.className='';out.textContent='Loading…';try{const r=await fetch('/api/senslog'+path);const t=await r.text();if(!r.ok)out.className='error';out.textContent=(r.ok?'':'HTTP '+r.status+' — ')+t}catch(e){out.className='error';out.textContent='Request failed: '+e.message}}</script></body></html>
