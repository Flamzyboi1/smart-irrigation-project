<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EcoIGM SensLog</title><style>body{font:15px Arial;margin:0;background:#eef6ef;color:#17362a}header{padding:20px 6%;background:#fff;border-bottom:1px solid #d5e5d7}main{max-width:1200px;margin:auto;padding:28px 5%}.card{background:#fff;padding:20px;border:1px solid #d5e5d7;border-radius:12px;margin-bottom:20px}button{background:#116b45;color:#fff;border:0;padding:10px 14px;border-radius:6px;font-weight:bold;cursor:pointer;margin-right:8px}pre{white-space:pre-wrap;max-height:480px;overflow:auto;background:#f5f7f5;padding:15px;border-radius:8px}</style></head><body><header><strong>⌁ EcoIGM</strong> · SensLog Vestiena · Smart Irrigation</header><main><div class="card"><h1>Vestiena sensor data</h1><p>User ID: 29 · Group: vestiena</p><button onclick="load('/latest')">Load latest observations</button><button onclick="load('/units')">Load physical units</button></div><div class="card"><h2>Response</h2><pre id="out">Click a button to load data.</pre></div></main><script>async function load(path){const out=document.getElementById('out');out.textContent='Loading…';try{const r=await fetch('/api/senslog'+path);out.textContent=await r.text()}catch(e){out.textContent='Request failed: '+e.message}}</script></body></html>
