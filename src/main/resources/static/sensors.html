<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sensors — ECO IGM</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f8f5;color:#24352c}.header{background:#176b45;color:#fff;padding:20px 4%;display:flex;justify-content:space-between;align-items:center}.header h1{margin:0;font-size:24px}.header p{margin:5px 0 0;font-size:14px}.wrap{padding:22px 4%}.panel{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 14px rgba(0,0,0,.08);margin-bottom:18px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:4px}.field input,.field select{width:100%;padding:9px;border:1px solid #ccd8ce;border-radius:5px;box-sizing:border-box}.btn{background:#176b45;color:#fff;border:0;border-radius:6px;padding:10px 15px;cursor:pointer;margin-top:12px}.msg{margin-top:10px}.error{color:#991b1b;background:#fee2e2;padding:10px;border-radius:6px}.ok{color:#176b45}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e3ebe5;text-align:left}th{background:#176b45;color:#fff}.empty{padding:18px 0}@media(max-width:800px){.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.formgrid{grid-template-columns:1fr}}</style></head><body><header class="header"><div><h1>ECO IGM</h1><p data-i18n="smartPrototype">Smart Irrigation Prototype</p></div></header><main class="wrap"><section class="panel"><h2 data-i18n="sensorConfiguration">Sensor Configuration</h2><form id="sensorForm"><div class="formgrid"><div class="field"><label data-i18n="sensorName">Sensor Name</label><input name="name" required></div><div class="field"><label data-i18n="sensorCode">Sensor Code</label><input name="sensorCode"></div><div class="field"><label data-i18n="sensorType">Sensor Type</label><select name="type"><option>Soil Moisture</option><option>Temperature</option><option>Humidity</option><option>Rainfall</option><option>Light</option><option>Other</option></select></div><div class="field"><label data-i18n="field">Field</label><input name="fieldName"></div><div class="field"><label data-i18n="zone">Zone</label><input name="zoneName"></div><div class="field"><label data-i18n="status">Status</label><select name="status"><option>ACTIVE</option><option>INACTIVE</option><option>OFFLINE</option></select></div></div><button class="btn" type="submit" data-i18n="saveSensor">Save Sensor</button><div id="msg" class="msg"></div></form></section><section class="panel"><h2 data-i18n="sensors">Sensors</h2><div style="overflow:auto"><table><thead><tr><th data-i18n="sensorName">Sensor Name</th><th data-i18n="sensorCode">Sensor Code</th><th data-i18n="sensorType">Sensor Type</th><th data-i18n="field">Field</th><th data-i18n="zone">Zone</th><th data-i18n="status">Status</th><th data-i18n="lastReading">Last Reading</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty" data-i18n="loading">Loading...</td></tr></tbody></table></div></section></main><script src="/js/lang.js"></script><script src="/js/site-nav.js"></script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function val(o,...keys){for(const k of keys)if(o?.[k]!==undefined&&o[k]!==null)return o[k];return ''}async function load(){try{const r=await fetch('/api/sensors');if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const a=Array.isArray(d)?d:(d._embedded?Object.values(d._embedded).find(Array.isArray)||[]:[]);document.getElementById('rows').innerHTML=a.map(s=>`<tr><td>${esc(val(s,'name','sensorName','id'))}</td><td>${esc(val(s,'sensorCode','code'))}</td><td>${esc(val(s,'type','sensorType'))}</td><td>${esc(val(s,'fieldName','fieldBlockName'))}</td><td>${esc(val(s,'zoneName','zone'))}</td><td>${esc(val(s,'status'))}</td><td>${esc(val(s,'lastReading','lastReadingAt'))}</td></tr>`).join('')||`<tr><td colspan="7" class="empty">${t('noSensors')}</td></tr>`}catch(e){document.getElementById('rows').innerHTML=`<tr><td colspan="7" class="empty">${t('loadError')}: ${esc(e.message)}</td></tr>`}}document.getElementById('sensorForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/sensors',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('HTTP '+r.status);document.getElementById('msg').className='msg ok';document.getElementById('msg').textContent=t('savedSensor');e.target.reset();load()}catch(x){document.getElementById('msg').className='msg error';document.getElementById('msg').textContent=t('saveError')+': '+x.message}};load();</script></body></html>
