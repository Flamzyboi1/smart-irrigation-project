<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sensors</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f4f4; }

    .head {
      padding: 14px 4%;
      background: #176b45;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .head h1 { font-size: 18px; }

    nav a {
      color: white;
      margin-left: 12px;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
    }
    nav a:hover { text-decoration: underline; }

    .container { padding: 20px 4%; }

    .card {
      background: white;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
    }

    .card h3 {
      margin: 0 0 8px;
      color: #176b45;
      font-size: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
    }

    td {
      padding: 6px 8px;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }

    td:first-child {
      font-weight: bold;
      color: #555;
      width: 180px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
    }

    .IRRIGATE_NOW { background: #f8d7da; color: #721c24; }
    .IRRIGATE { background: #fff3cd; color: #856404; }
    .ADEQUATE { background: #d4edda; color: #155724; }
    .EXCESS_WATER { background: #cce5ff; color: #004085; }

    #error {
      color: red;
      font-weight: bold;
      padding: 10px 0;
    }
  </style>
</head>
<body>
  <div class="head">
    <h1>Sensor Overview</h1>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="sensors.html">Sensors</a>
      <a href="zones.html">Zones</a>
      <a href="alerts.html">Alerts</a>
      <a href="readings.html">Readings</a>
    </nav>
  </div>

  <div class="container">
    <div id="error"></div>
    <div id="container"><p>Loading...</p></div>
  </div>

  <script>
    function safe(v, fallback = '-') {
      return v === null || v === undefined || v === '' ? fallback : v;
    }

    function num(v, digits = 1, suffix = '') {
      return v === null || v === undefined || isNaN(v) ? '-' : Number(v).toFixed(digits) + suffix;
    }

    function badgeClass(rec) {
      return (rec || 'ADEQUATE').replace(/\s+/g, '_');
    }

    fetch('/api/sensors')
      .then(r => r.json())
      .then(data => {
        const c = document.getElementById('container');
        if (!data.length) {
          c.innerHTML = '<p>No sensors found.</p>';
          return;
        }

        c.innerHTML = data.map(s => `
          <div class="card">
            <h3>
              ${safe(s.label, s.sensorId)}
              <span class="badge ${badgeClass(s.recommendation)}">${safe(s.recommendation, 'NO DATA')}</span>
            </h3>
            <table>
              <tr><td>Sensor ID</td><td>${safe(s.sensorId)}</td></tr>
              <tr><td>Type</td><td>${safe(s.type)}</td></tr>
              <tr><td>Zone</td><td>${safe(s.zoneName)}</td></tr>
              <tr><td>Crop</td><td>${safe(s.cropType)}</td></tr>
              <tr><td>Zone Status</td><td>${safe(s.zoneStatus)}</td></tr>
              <tr><td>Soil %</td><td>${num(s.soilPercent, 1, '%')}</td></tr>
              <tr><td>VWC</td><td>${num(s.volumetricWaterContent, 1, '%')}</td></tr>
              <tr><td>Temperature</td><td>${num(s.temperature, 1, '°C')}</td></tr>
              <tr><td>Humidity</td><td>${num(s.humidity, 1, '%')}</td></tr>
              <tr><td>Rainfall</td><td>${num(s.rainfall, 1, ' mm')}</td></tr>
              <tr><td>Flow Rate</td><td>${num(s.flowRate, 2, ' L/min')}</td></tr>
              <tr><td>Battery</td><td>${num(s.batteryVoltage, 2, ' V')}</td></tr>
              <tr><td>Valve</td><td>${s.valveOpen ? '<b style="color:green">OPEN</b>' : '<b style="color:red">CLOSED</b>'}</td></tr>
              <tr><td>Threshold</td><td>${num(s.threshold, 1, '%')}</td></tr>
              <tr><td>Last Reading</td><td>${safe(s.timestamp)}</td></tr>
            </table>
          </div>
        `).join('');
      })
      .catch(e => {
        document.getElementById('error').textContent = 'API error: ' + e.message;
        document.getElementById('container').innerHTML = '';
      });
  </script>
</body>
</html>
