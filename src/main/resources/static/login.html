<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — ECO IGM</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f8f5;color:#24352c;display:grid;place-items:center;min-height:100vh}.card{width:min(420px,90vw);background:#fff;padding:28px;border-radius:12px;box-shadow:0 2px 14px rgba(0,0,0,.12)}h1{margin-top:0;color:#176b45}label{display:block;margin:14px 0 6px;font-weight:bold}input{width:100%;padding:11px;border:1px solid #cbd8ce;border-radius:6px;font-size:14px;box-sizing:border-box}button{margin-top:18px;background:#176b45;color:#fff;border:0;border-radius:6px;padding:11px 16px;cursor:pointer;font-weight:bold;width:100%}.error{margin-top:14px;padding:10px;border-radius:6px;background:#fee2e2;color:#991b1b}small{display:block;margin-top:16px;color:#66756b}</style></head><body><main class="card"><h1>ECO IGM Smart Irrigation System</h1><form id="loginForm"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Log in</button><div id="error" class="error" hidden></div></form><small>Use your assigned ECO IGM account.</small></main><script>const form=document.getElementById('loginForm');const error=document.getElementById('error');form.addEventListener('submit',async e=>{e.preventDefault();error.hidden=true;const username=document.getElementById('username').value.trim();const password=document.getElementById('password').value;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({username,password})});const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch{}if(!r.ok)throw Error(data.message||data.error||`Login failed (HTTP ${r.status})`);if(data.token)sessionStorage.setItem('authToken',data.token);sessionStorage.setItem('currentUser',JSON.stringify(data.user||data));window.location.href='/dashboard.html'}catch(x){error.textContent=x.message;error.hidden=false}});</script></body></html>
