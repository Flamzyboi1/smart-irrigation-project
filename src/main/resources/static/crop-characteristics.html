<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crop Characteristics</title><style>body{font:15px Arial;margin:0;background:#eef8f0;color:#183b25}header,main{padding:18px 6%;background:#fff;border-bottom:1px solid #d4e4d6}main{background:transparent}nav a{margin-right:14px;color:#183b25}.card{background:#fff;padding:20px;margin:18px 0;border:1px solid #d4e4d6;border-radius:12px}table{border-collapse:collapse;width:100%}th,td{padding:10px;border-bottom:1px solid #d4e4d6;text-align:left}button{background:#1b6b32;color:#fff;border:0;padding:9px 12px;border-radius:6px}</style></head><body><header><nav><a href="/dashboard.html">Dashboard</a><a href="/water-calculation.html">Water calculation</a><a href="/crop-characteristics.html">Crop characteristics</a><a href="/cost-estimate.html">Cost estimate</a><a href="/senslog.html">SensLog</a></nav></header><main><div class="card"><button onclick="lang='en';render()">English</button> <button onclick="lang='lv';render()">Latviešu</button><h1 id="title">Crop characteristics</h1><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div></main><script>let lang='en',data=[];async function init(){data=(await (await fetch('/data/crop-characteristics.json')).json()).crops;render()}function render(){title.textContent=lang==='lv'?'Kultūru raksturojums':'Crop characteristics';head.innerHTML=(lang==='lv'?['Kultūra','Kc','Sakņu dziļums (m)','Lauka mitrums (%)','Vīšanas punkts (%)']:['Crop','Kc','Root depth (m)','Field capacity (%)','Wilting point (%)']).map(x=>`<th>${x}</th>`).join('');body.innerHTML=data.map(c=>`<tr><td>${c.name[lang]}</td><td>${c.kc}</td><td>${c.rootDepthM}</td><td>${c.fieldCapacityPercent}</td><td>${c.wiltingPointPercent}</td></tr>`).join('')}init()</script></body></html>
